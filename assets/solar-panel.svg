<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" width="200" height="160">
  <defs>
    <linearGradient id="panel-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a5c"/>
      <stop offset="50%" stop-color="#0f2a4a"/>
      <stop offset="100%" stop-color="#0a1e3a"/>
    </linearGradient>
    <linearGradient id="panel-shine" x1="0%" y1="0%" x2="50%" y2="50%">
      <stop offset="0%" stop-color="#4fc3f7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff8800"/>
    </linearGradient>
    <filter id="sun-glow">
      <feGaussianBlur stdDeviation="3" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Sun -->
  <circle cx="160" cy="25" r="16" fill="url(#sun-grad)" filter="url(#sun-glow)"/>
  <g stroke="#ffaa00" stroke-width="1.5" opacity="0.6">
    <line x1="160" y1="5" x2="160" y2="0"/>
    <line x1="160" y1="45" x2="160" y2="50"/>
    <line x1="140" y1="25" x2="135" y2="25"/>
    <line x1="180" y1="25" x2="185" y2="25"/>
    <line x1="146" y1="11" x2="143" y2="8"/>
    <line x1="174" y1="11" x2="177" y2="8"/>
    <line x1="146" y1="39" x2="143" y2="42"/>
    <line x1="174" y1="39" x2="177" y2="42"/>
  </g>
  <!-- Panel array -->
  <g transform="translate(20, 50)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="50" height="35" rx="2" fill="url(#panel-face)" stroke="#2a5a8a" stroke-width="1"/>
    <rect x="0" y="0" width="50" height="35" rx="2" fill="url(#panel-shine)"/>
    <line x1="25" y1="0" x2="25" y2="35" stroke="#2a5a8a" stroke-width="0.5"/>
    <line x1="0" y1="17" x2="50" y2="17" stroke="#2a5a8a" stroke-width="0.5"/>

    <rect x="55" y="0" width="50" height="35" rx="2" fill="url(#panel-face)" stroke="#2a5a8a" stroke-width="1"/>
    <rect x="55" y="0" width="50" height="35" rx="2" fill="url(#panel-shine)"/>
    <line x1="80" y1="0" x2="80" y2="35" stroke="#2a5a8a" stroke-width="0.5"/>
    <line x1="55" y1="17" x2="105" y2="17" stroke="#2a5a8a" stroke-width="0.5"/>

    <rect x="110" y="0" width="50" height="35" rx="2" fill="url(#panel-face)" stroke="#2a5a8a" stroke-width="1"/>
    <rect x="110" y="0" width="50" height="35" rx="2" fill="url(#panel-shine)"/>
    <line x1="135" y1="0" x2="135" y2="35" stroke="#2a5a8a" stroke-width="0.5"/>
    <line x1="110" y1="17" x2="160" y2="17" stroke="#2a5a8a" stroke-width="0.5"/>

    <!-- Row 2 -->
    <rect x="0" y="40" width="50" height="35" rx="2" fill="url(#panel-face)" stroke="#2a5a8a" stroke-width="1"/>
    <rect x="0" y="40" width="50" height="35" rx="2" fill="url(#panel-shine)"/>
    <line x1="25" y1="40" x2="25" y2="75" stroke="#2a5a8a" stroke-width="0.5"/>
    <line x1="0" y1="57" x2="50" y2="57" stroke="#2a5a8a" stroke-width="0.5"/>

    <rect x="55" y="40" width="50" height="35" rx="2" fill="url(#panel-face)" stroke="#2a5a8a" stroke-width="1"/>
    <rect x="55" y="40" width="50" height="35" rx="2" fill="url(#panel-shine)"/>
    <line x1="80" y1="40" x2="80" y2="75" stroke="#2a5a8a" stroke-width="0.5"/>
    <line x1="55" y1="57" x2="105" y2="57" stroke="#2a5a8a" stroke-width="0.5"/>

    <rect x="110" y="40" width="50" height="35" rx="2" fill="url(#panel-face)" stroke="#2a5a8a" stroke-width="1"/>
    <rect x="110" y="40" width="50" height="35" rx="2" fill="url(#panel-shine)"/>
    <line x1="135" y1="40" x2="135" y2="75" stroke="#2a5a8a" stroke-width="0.5"/>
    <line x1="110" y1="57" x2="160" y2="57" stroke="#2a5a8a" stroke-width="0.5"/>
  </g>
  <!-- Energy flow lines -->
  <path d="M100 130 Q120 140 140 130 Q155 120 160 100" fill="none" stroke="#ffaa00" stroke-width="1" opacity="0.5" stroke-dasharray="3 4"/>
  <path d="M60 130 Q40 140 30 145" fill="none" stroke="#00e676" stroke-width="1" opacity="0.4" stroke-dasharray="3 4"/>
</svg>
